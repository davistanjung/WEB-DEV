<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
       
    <!-- Top Navigation -->
     <nav>
        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">PRODUCT</a></li>
            <li><a href="#">GALLERY</a></li>
            <li><a href="#">BLOG</a></li>
            <li><a href="#">INVENTORY</a></li>
        </ul>
     </nav>

  <!-- Profile Info -->
  
<section class="profile-container">
  <!-- Kolom 1: Foto -->
  <div class="profile-photo">
    <img src="profil.avif" alt="Foto Profil">
  </div>

  <!-- Kolom 2: Nama dan Jabatan -->
  <div class="profile-name">
    <h2>Davis Rapala Tanjung S,Kom</h2>
    <p>Pegawai Negeri Sipil</p>
  </div>

  <!-- Kolom 3: Informasi Lengkap -->
  <div class="profile-info">
    <div class="info-block">
      <div class="label">Availability:</div>
      <div>Full Time</div>
    </div>

    <div class="info-block">
      <div class="label">Usia:</div>
      <div>19</div>
    </div>

    <div class="info-block">
      <div class="label">Lokasi:</div>
      <div>Jakarta</div>
    </div>

    <div class="info-block">
      <div class="label">Pengalaman:</div>
      <div>2 Tahun</div>
    </div>

    <div class="info-block">
      <div class="label">Email:</div>
      <div>email@gmail.com</div>
    </div>
  </div>
</section>

  <!-- Form -->
  <form action="" method="post" id="profileForm">
    <div>
        <label>Nama</label>
         <input type="text" id="nama" name="nama" placeholder="masukkan nama anda">
    </div>

    <div>
        <label>Role</label>
        <input type="text" id="role" name="role" placeholder="masukkan role anda">
    </div>

    <div>
        <label>Availability</label>
        <input type="text" id="availability" name="availability" placeholder="masukkan availability anda">
    </div>

    <div>
        <label>Usia</label>
        <input type="text" id="usia" name="usia" placeholder="masukkan usia anda">
    </div>

    <div>
        <label>Lokasi</label>
        <input type="text" id="lokasi" name="lokasi" placeholder="masukkan lokasi anda">
    </div>

    <div>
        <label>Years Experience</label>
        <input type="text" id="experience" name="experience" placeholder="masukkan pengalaman anda">
    </div>

    <div>
        <label>Email</label>
        <input type="email" id="email" name="email" placeholder="masukkan email anda">
    </div> 
    <button type="submit">Submit</button>
</form>
</body>
</html>
